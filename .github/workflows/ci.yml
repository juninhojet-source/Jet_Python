name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Motor de pontuação (pytest)
        run: pytest tests/ -q

      - name: Aplicação Django (manage.py test)
        run: python manage.py test -v2

      - name: Verificação de produção (check --deploy)
        env:
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: "exemplo.mg.gov.br"
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'from django.core.management.utils import get_random_secret_key as g; print(g())')"
          python manage.py check --deploy

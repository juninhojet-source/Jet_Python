{% extends "cadastro/wizard_base.html" %}
{% block etapa %}
<div class="card">
  <h2>1. Dados do requerente</h2>
  <form method="post" class="pilha">
    {% csrf_token %}
    <div class="grid2">
      {% include "cadastro/_campos.html" with form=form_pessoa %}
    </div>
    <h2>Contato e endereço</h2>
    <div class="grid2">
      {% include "cadastro/_campos.html" with form=form_contato %}
    </div>
    <div style="margin-top:1.2rem">
      <button class="btn" type="submit" name="acao" value="avancar">Salvar e avançar ▶</button>
      <button class="btn secundario" type="submit">Salvar</button>
    </div>
  </form>
</div>
{% endblock %}

{% if is_paginated %}
<div class="pagination">
  {% if page_obj.has_previous %}
    <a href="?{% if q %}q={{ q }}&{% endif %}page={{ page_obj.previous_page_number }}">‹ Anterior</a>
  {% endif %}
  <span class="current">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a href="?{% if q %}q={{ q }}&{% endif %}page={{ page_obj.next_page_number }}">Próxima ›</a>
  {% endif %}
</div>
{% endif %}
